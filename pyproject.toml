[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "masonq"
version = "0.1.0"
description = "Layout-aware transpiler between Qiskit circuits and brickwork (MBQC) patterns."
readme = "README.MD"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Rex Fleur" }]
dependencies = [
  "numpy>=2,<2.3",
  "networkx>=3.2,<4",
  "qiskit>=2.4.1,<3",
  "qiskit-aer>=0.17.2,<0.18",
  "qiskit-algorithms>=0.4.0,<0.5",
  "graphix>=0.3.5,<0.4",
  "quimb>=1.11.2,<1.12",
  "numba>=0.61,<0.62",
  "llvmlite>=0.44,<0.45",
  "tensornetwork>=0.4",
  "matplotlib>=3.8,<4",
  "pylatexenc>=2.10",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/Nonsens24/brickwork_transpiler"
Issues = "https://github.com/Nonsens24/brickwork_transpiler/issues"

[project.scripts]
masonq-demo = "brickwork_transpiler.main:main"

[project.optional-dependencies]
viz = [
  "tensornetwork>=0.4",
  "matplotlib>=3.8,<4",
  "pylatexenc>=2.10",
]
qrs = [
  "qiskit-aer>=0.17.2,<0.18",
  "qiskit-algorithms>=0.4.0,<0.5",
]
ibm = [
  "qiskit-ibm-runtime>=0.46.1,<0.47",
]
experiments = [
  "matplotlib>=3.8,<4",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
]
mbqc = [
  "tensornetwork>=0.4",
  "matplotlib>=3.8,<4",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "coverage[toml]>=7.4",
  "pytest-xdist>=3.3",
  "black>=24.3",
  "isort>=5.12",
  "mypy>=1.8",
  "pre-commit>=3.5",
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["brickwork_transpiler*"]

[tool.setuptools.package-data]
brickwork_transpiler = ["py.typed"]

# -----------------------
# Pytest + Coverage
# -----------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "--cov=src/brickwork_transpiler",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml",
  "--cov-report=html",
  "-q",
]
markers = [
  "unit: fast tests that do not run full MBQC/Qiskit simulations",
  "integration: tests that cover multiple package modules",
  "system: slow end-to-end Graphix/Qiskit equivalence tests",
  "slow: expensive simulations or large transpilation experiments",
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/brickwork_transpiler"]
# Ignore the top-level duplicate package directory if it stays around:
omit = [
  "brickwork_transpiler/*",
]
concurrency = ["multiprocessing", "thread"]

[tool.coverage.report]
# Exclude specific files from coverage *reporting*
omit = [
  "src/brickwork_transpiler/visualiser.py",
  "src/brickwork_transpiler/circuits.py",
  "src/brickwork_transpiler/QRS_variations.py",
  "src/brickwork_transpiler/bricks.py",
  "src/brickwork_transpiler/gx_angle_extractor.py",
  "src/brickwork_transpiler/main.py",
    "src/brickwork_transpiler/noise.py",
]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"
title = "Brickwork Transpiler coverage"

# -----------------------
# Formatting & Linting
# -----------------------
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
extend-exclude = """
(
  ^/build/
| ^/dist/
| ^/images/
| ^/old_tests/
)
"""

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
exclude = "(^build/|^dist/|^docs/|^images/|^old_tests/)"
mypy_path = ["src"]
