[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "masonq"
version = "0.2.0"
description = "Brickwork transpiler: Qiskit circuits to Graphix brickwork patterns for blind quantum computation."
readme = "README.MD"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Rex Fleur" }]
dependencies = [
  "numpy>=2,<3",
  "networkx>=3.2,<4",
  "qiskit>=2.4.1,<3",
  # 0.3.5 and 0.4.x both work; pip takes 0.4.x where numba >= 0.65 has wheels and
  # 0.3.5 on Intel Macs (see the numba bound below).
  "graphix>=0.3.5,<0.5",
  # Graphix needs quimb, which needs numba. Numba stopped publishing Intel macOS
  # wheels at 0.63 (llvmlite at 0.46), so without this bound pip tries to build
  # both from source on Intel Macs. numba 0.62 itself pins llvmlite 0.45 and
  # NumPy < 2.4.
  "numba<0.63; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/Nonsens24/MasonQ"
Issues = "https://github.com/Nonsens24/MasonQ/issues"

[project.scripts]
masonq-demo = "brickwork_transpiler.main:main"

[project.optional-dependencies]
viz = [
  "matplotlib>=3.9,<4",
  "pylatexenc>=2.10",
]
ibm = [
  "qiskit-ibm-runtime>=0.46.1,<0.47",
]
dev = [
  "matplotlib>=3.9,<4",
  "pylatexenc>=2.10",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "coverage[toml]>=7.4",
  "pytest-xdist>=3.3",
  "black>=24.3",
  "isort>=5.12",
  "mypy>=1.8",
  "pre-commit>=3.5",
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["brickwork_transpiler*"]

[tool.setuptools.package-data]
brickwork_transpiler = ["py.typed"]

# -----------------------
# Pytest + Coverage
# -----------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "--cov=src/brickwork_transpiler",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml",
  "--cov-report=html",
  "-q",
]
markers = [
  "unit: fast tests that do not run full MBQC/Qiskit simulations",
  "integration: tests that cover multiple package modules",
  "system: slow end-to-end Graphix/Qiskit equivalence tests",
  "slow: expensive simulations or large transpilation experiments",
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/brickwork_transpiler"]
concurrency = ["multiprocessing", "thread"]

[tool.coverage.report]
# Exclude specific files from coverage *reporting*
omit = [
  "src/brickwork_transpiler/visualiser.py",
  "src/brickwork_transpiler/circuits.py",
  "src/brickwork_transpiler/bricks.py",
  "src/brickwork_transpiler/main.py",
]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"
title = "Brickwork Transpiler coverage"

# -----------------------
# Formatting & Linting
# -----------------------
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
extend-exclude = """
(
  ^/build/
| ^/dist/
)
"""

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
pretty = true
show_error_codes = true
exclude = "(^build/|^dist/|^docs/)"
mypy_path = ["src"]
