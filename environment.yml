name: masonq-qiskit24
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  # Graphix pulls in quimb, which pulls in numba/llvmlite. Installing these
  # from conda avoids fragile local LLVM/C++ source builds on macOS.
  - numba=0.61.2
  - llvmlite=0.44.0
  - pip:
      - "quimb>=1.11.2,<1.12"
      - -e ".[dev]"
